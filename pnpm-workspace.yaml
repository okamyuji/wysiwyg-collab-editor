packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

allowBuilds:
  esbuild: true

# 脆弱性のあるバージョンを踏まないための下限固定。
# 範囲指定だと解決版が揺れて脆弱版が残るため、必ず具体バージョンで書く。
overrides:
  # 8.5.23 未満の脆弱版を避ける下限。
  postcss@<8.5.23: "8.5.25"
  qs@<6.16.0: "6.16.0"
  proxy-addr@<2.0.8: "2.0.8"
  tinypool@<2.1.2: "2.2.0"
  undici@<7.30.1: "7.30.1"
  serialize-javascript@<7.1.3: "7.1.3"
  fast-uri@<3.1.9: "3.1.9"

# 公開から7日未満の版を取得しない。pnpm 11 は .npmrc の minimum-release-age を読まないため、ここに書く。
minimumReleaseAge: 10080 # 60 * 24 * 7 = 7日（分）
# 7日未満の版の例外。1版ずつ書き、7日を過ぎたら消す
minimumReleaseAgeExclude:
  - "@aws-sdk/checksums@3.1001.5"
  - "@aws-sdk/client-s3@3.1156.0"
  - "@aws-sdk/core@3.978.5"
