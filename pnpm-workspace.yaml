packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

allowBuilds:
  esbuild: true

# 脆弱性のあるバージョンを踏まないための下限固定。
# 範囲指定だと解決版が揺れて脆弱版が残るため、必ず具体バージョンで書く。
overrides:
  # 8.5.26 は公開7日未満で minimumReleaseAge に弾かれるため 8.5.25 に固定する。
  postcss@<8.5.23: "8.5.25"
  qs@<6.16.0: "6.16.0"
  proxy-addr@<2.0.8: "2.0.8"
  tinypool@<2.1.2: "2.2.0"

# 公開から7日未満の版を取得しない。pnpm 11 は .npmrc の minimum-release-age を読まないため、ここに書く。
minimumReleaseAge: 10080 # 60 * 24 * 7 = 7日（分）
